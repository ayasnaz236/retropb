<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Activate</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #eee4cc url("image-1791214929227.png") center / cover fixed no-repeat;
    color: #17242a;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 380px; padding: 32px; text-align: center; background: rgba(255, 247, 231, .94); border: 2px solid #17242a; box-shadow: 8px 8px 0 rgba(23, 36, 42, .9); }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #b83e3a; font-size: 0.9rem; margin-top: 0; margin-bottom: 28px; }
  label { display: block; text-align: left; font-size: 0.85rem; color: #17242a; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 0;
    background: #fff; border: 2px solid #17242a; color: #17242a; font-size: 0.95rem;
  }
  button {
    margin-top: 24px; width: 100%; padding: 12px; border: 2px solid #17242a; border-radius: 0;
    background: #c55b52; color: #fff7e7; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 3px 3px 0 #17242a;
  }
  button:hover { background: #b83e3a; }
  button:disabled { background: #777863; cursor: not-allowed; }
  #error { color: #b83e3a; font-size: 0.85rem; margin-top: 14px; min-height: 18px; }
  .device-id { margin-top: 24px; font-size: 0.75rem; color: #777863; }
</style>
</head>
<body>
  <div class="card">
    <h1>Activate Photo Booth</h1>
    <p class="sub">Enter your license details to get started.</p>

    <label>Email or Phone</label>
    <input type="text" id="contact" placeholder="you@example.com" />

    <label>License Key</label>
    <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX" />

    <button id="btn-activate">Activate</button>
    <div id="error"></div>
    <div class="device-id" id="device-id"></div>
  </div>

  <script src="activation-renderer.js"></script>
</body>
</html>
